# Firewall INNERHALB des Clusters: Wer darf mit der Datenbank sprechen?
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spiel-db-zugriff
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: spiel-db        # gilt für die Datenbank-Pods
  policyTypes: [Ingress]
  ingress:
    # Die App darf auf Port 5432
    - from:
        - podSelector:
            matchLabels:
              app: reaktionsspiel
      ports:
        - port: 5432
    # Die DB-Instanzen untereinander (Replikation)
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: spiel-db
    # Der Operator muss den Zustand der Instanzen abfragen
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Prometheus darf Messwerte abholen
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
