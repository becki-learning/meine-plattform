# Horizontal Pod Autoscaler: mehr Last -> mehr Pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reaktionsspiel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reaktionsspiel
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60     # Ziel: 60 % der angefragten CPU (requests)
