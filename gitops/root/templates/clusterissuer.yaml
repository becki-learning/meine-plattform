apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  annotations:
    # Den Typ ClusterIssuer gibt es erst, wenn cert-manager installiert ist -> nicht vorab prüfen
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-konto
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
